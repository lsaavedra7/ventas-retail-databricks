name: Validate project

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Validate source data
        shell: pwsh
        run: ./scripts/validate_data.ps1
